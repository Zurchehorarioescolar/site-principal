<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESCOLHA A HISTÓRIA — ZURCHE</title>
<link rel="stylesheet" href="style.css">
<style>
body{color-scheme:light;background:#f8f6ef;color:#322052}
.shell{max-width:960px}header{border-color:#d5e3de;gap:12px;height:auto;min-height:72px;padding-block:12px}
header .back{color:#55278c;background:#e1f3ed;border-radius:16px;padding:8px 12px}
.page-title{padding:28px 0 18px}.page-title h1{font-size:clamp(25px,5vw,40px)}
.story-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),360px));gap:20px;margin-bottom:36px}
.story{overflow:hidden;border-radius:24px;background:#fff;border:2px solid #c9dfd9;box-shadow:0 5px 0 #dbe9e4}
.cover{display:flex;align-items:end;justify-content:center;gap:6px;min-height:152px;padding:20px 12px;background:radial-gradient(circle at 22% 22%,#fff4b3 0 9%,transparent 9.5%),linear-gradient(160deg,#d8eef9 55%,#d7eee1 55%)}
.cover .drawing{width:29%}.cover .bed{width:35%}.cover svg{display:block;width:100%;height:auto}
.story-copy{padding:18px}.story-copy h2{font-size:23px;margin:0}.story-copy p{font-size:14px;color:#513d66;margin:8px 0 15px}
.story .story-link{display:inline-flex;background:#6034aa;color:white;padding:8px 14px;min-height:40px;font-size:13px;border-radius:14px}
.story-link:hover{background:#482484}.story-link:focus-visible,.back:focus-visible{outline:3px solid #55278c;outline-offset:3px}
.caca-cover{background:#d8eef9;padding:12px}.caca-cover img{display:block;max-width:100%;height:auto;max-height:245px;border-radius:10px}
.cover.caca-cover{height:260px;padding:12px;align-items:center}.cover.caca-cover img{width:100%;height:100%;max-height:none;object-fit:contain}.story{display:flex;flex-direction:column}.story-copy{flex:1;display:flex;flex-direction:column}.story-link{align-self:flex-start;margin-top:auto}

.story{position:relative}
.story-link::after{content:"";position:absolute;inset:0;border-radius:24px}
.story:has(.story-link:focus-visible){outline:3px solid #55278c;outline-offset:4px}
.story:hover{border-color:#6034aa}
</style>
</head>
<body><div class="shell">
<header><span class="brand">ALFABETIZAÇÃO DIGITAL</span><a class="back" href="alfabetizacao.html">← ALFABETIZAÇÃO</a></header>
<main>
<div class="page-title"><h1>ESCOLHA A HISTÓRIA</h1></div>
<label for="storySelect">ESCOLHA A HISTÓRIA</label><select id="storySelect" style="display:block;padding:10px;margin:10px 0 22px;max-width:100%;font:inherit"><option value="">SELECIONE</option><option value="lili.html">A BONECA DE CACÁ</option><option value="bibi-zoo.html">BIBI NO ZOOLÓGICO</option></select><script>document.getElementById("storySelect").onchange=e=>{if(e.target.value)location.href=e.target.value;};</script><section class="story-grid" aria-label="HISTÓRIAS">
<article class="story"><div class="cover caca-cover"><img src="caca-capa.png" alt="Cacá com a boneca no colo"></div><div class="story-copy"><h2>A BONECA DE CACÁ</h2><p>LEIA, BRINQUE COM A BONECA E MONTE PALAVRAS.</p><a class="btn story-link" href="lili.html">LER A HISTÓRIA →</a></div></article>
<article class="story"><div class="cover caca-cover"><img src="bibi-zoo-pagina-1.png" alt="BIBI NA ENTRADA DO ZOOLÓGICO"></div><div class="story-copy"><h2>BIBI NO ZOOLÓGICO</h2><p>ACOMPANHE BIBI E FOLHEIE AS PÁGINAS DA HISTÓRIA.</p><a class="btn story-link" href="bibi-zoo.html">LER A HISTÓRIA →</a></div></article></section>
</main></div></body></html>
